name: Install dependencies + generate Prisma client
description: >
  Shared, cached "npm ci" + "prisma generate" used by every CI job so the
  same install/codegen work isn't repeated 6+ times per workflow run.
  Requires actions/setup-node to have run first.

runs:
  using: composite
  steps:
    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: npm ci
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Cache Prisma client
      id: prisma-client-cache
      uses: actions/cache@v4
      with:
        path: src/generated/prisma
        key: prisma-client-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma', 'package-lock.json') }}

    - name: prisma generate
      if: steps.prisma-client-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx prisma generate
