name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/install-deps

      - run: npm run lint
      - run: npx tsc --noEmit

  security-deps:
    name: Security — Dependencies
    runs-on: ubuntu-latest
    # Upstream advisories in transitive deps can fail this on every PR even
    # when nothing in the diff touches them. Renovate is the actual lane
    # that tracks and bumps vulnerable deps; this job stays as a visible,
    # non-blocking signal (job summary / PR checks) instead of gating merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/install-deps

      - name: Migrate DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/ci.db

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/ci.db

      # Shared by test-e2e and performance so they don't each pay for
      # their own `next build` — only the DB + server boot differ.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: |
            .next
            !.next/cache
          retention-days: 1

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-unit:
    name: Unit tests (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/install-deps

      - run: npm run test:unit

  test-e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/install-deps

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: .next

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Migrate E2E DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/e2e.db

      - name: Start server
        run: npm start &
        env:
          DATABASE_URL: file:/tmp/e2e.db
          UPLOAD_DIR: /tmp/e2e-uploads
          PORT: 3000
          NODE_ENV: production

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: "true"
          DATABASE_URL: file:/tmp/e2e.db
          UPLOAD_DIR: /tmp/e2e-uploads

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  performance:
    name: Performance (Lighthouse)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: ./.github/actions/install-deps

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.run_id }}
          path: .next

      - name: Migrate DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/ci.db

      - name: Start Next.js server
        run: npm start &
        env:
          DATABASE_URL: file:/tmp/ci.db
          PORT: 3000
          NODE_ENV: production

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
