name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  security-deps:
    name: Security — Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Migrate DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/ci.db

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/ci.db

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-unit:
    name: Unit tests (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit

  test-e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Migrate E2E DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/e2e.db

      - name: Next.js build (E2E)
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/e2e.db

      - name: Start server
        run: npm start &
        env:
          DATABASE_URL: file:/tmp/e2e.db
          UPLOAD_DIR: /tmp/e2e-uploads
          PORT: 3000
          NODE_ENV: production

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: "true"
          DATABASE_URL: file:/tmp/e2e.db
          UPLOAD_DIR: /tmp/e2e-uploads

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  performance:
    name: Performance (Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Migrate DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/ci.db

      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: file:/tmp/ci.db

      - name: Start Next.js server
        run: npm start &
        env:
          DATABASE_URL: file:/tmp/ci.db
          PORT: 3000
          NODE_ENV: production

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
