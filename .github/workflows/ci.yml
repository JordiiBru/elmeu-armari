name: CI

# Lean by design, with a strict split between the two pipelines:
#
#   PR           -> this workflow: one job (lint + typecheck + unit tests +
#                   next build). No Docker, no deploy.
#   push to main -> release.yml ONLY: auto-tag + a single Docker build
#                   pushed to GHCR (next build runs inside the Dockerfile).
#
# A push to main must never trigger more than that one image build, so this
# workflow deliberately has no `push` trigger. E2E (Playwright) and
# Lighthouse run locally, not here — private repo, Actions minutes are the
# scarce resource.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test:unit

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:/tmp/ci.db

      - run: npm run build
        env:
          DATABASE_URL: file:/tmp/ci.db
