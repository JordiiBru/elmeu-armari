name: Build rembg sidecar image

# The background removal sidecar (sidecars/rembg) is versioned by its own
# commit, not by the app's release tags: it changes rarely, and a release of
# the app should not rebuild a 1 GB Python image. The homelab pins the
# sha-<short> tag this publishes.
on:
  push:
    branches: [main]
    paths:
      - "sidecars/rembg/**"
      - ".github/workflows/rembg-image.yml"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push rembg image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/elmeu-armari-rembg
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sidecars/rembg
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
