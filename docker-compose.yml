services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: file:/data/prod.db
    image: ghcr.io/jordiibru/elmeu-armari:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/prod.db
      UPLOAD_DIR: /data/uploads
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
